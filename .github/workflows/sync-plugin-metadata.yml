name: Sync Plugin Metadata to Plugin Market

on:
  push:
    paths:
      - 'main.py'
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_REPO: ElainaCore/Elaina-plugins
  TARGET_BRANCH: main

jobs:
  sync-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout your plugin repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PLUGIN_SYNC_TOKEN }}
      
      - name: Set fork info
        id: fork_info
        run: |
          echo "fork_owner=${{ github.repository_owner }}" >> $GITHUB_OUTPUT
          echo "fork_repo=${{ github.repository_owner }}/Elaina-plugins" >> $GITHUB_OUTPUT
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Check if metadata changed
        id: check_metadata_changed
        run: |
          git show HEAD~1:main.py > main_old.py 2>/dev/null || echo "" > main_old.py
          python .github/scripts/extract_metadata_compare.py main_old.py main.py
          
          if [ -f "metadata_changed.txt" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            cat metadata_changed.txt
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  main.py 中的元数据未发生变化，跳过同步"
          fi
      
      - name: Extract metadata from main.py
        if: steps.check_metadata_changed.outputs.has_changes == 'true'
        id: extract_meta
        run: python .github/scripts/extract_metadata.py
      
      - name: Check if metadata exists
        if: steps.check_metadata_changed.outputs.has_changes == 'true'
        id: check_meta
        run: |
          if [ -f "metadata.json" ]; then
            echo "has_metadata=true" >> $GITHUB_OUTPUT
            echo "plugin_name=$(jq -r '.name' metadata.json)" >> $GITHUB_OUTPUT
          else
            echo "has_metadata=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Clone target repository
        if: |
          steps.check_metadata_changed.outputs.has_changes == 'true' &&
          steps.check_meta.outputs.has_metadata == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          path: target-repo
          token: ${{ secrets.PLUGIN_SYNC_TOKEN }}
          fetch-depth: 1
      
      - name: Update plugins.json in target repo
        if: |
          steps.check_metadata_changed.outputs.has_changes == 'true' &&
          steps.check_meta.outputs.has_metadata == 'true'
        run: |
          cd target-repo
          python ../.github/scripts/update_target_json.py ../metadata.json
      
      - name: Check for changes in target repo
        if: |
          steps.check_metadata_changed.outputs.has_changes == 'true' &&
          steps.check_meta.outputs.has_metadata == 'true'
        id: check_changes
        run: |
          cd target-repo
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git status
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          fi
      
      - name: Push to fork
        if: |
          steps.check_metadata_changed.outputs.has_changes == 'true' &&
          steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_SYNC_TOKEN }}
        run: |
          cd target-repo
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 使用专用分支，避免污染 fork 的 main
          BRANCH_NAME="sync/plugin-metadata"
          
          git checkout -b "${BRANCH_NAME}"
          git add plugins.json
          git commit -m "chore: sync plugin metadata from ${{ github.repository }}

          Plugin: ${{ steps.check_meta.outputs.plugin_name }}"
          
          git remote add fork "https://x-access-token:${GH_TOKEN}@github.com/${{ steps.fork_info.outputs.fork_repo }}.git"
          git push fork "${BRANCH_NAME}:${BRANCH_NAME}" --force
          
          echo "branch_name=${BRANCH_NAME}" >> $GITHUB_OUTPUT
      
      - name: Verify remote branch with git ls-remote
        if: |
          steps.check_metadata_changed.outputs.has_changes == 'true' &&
          steps.check_changes.outputs.has_changes == 'true'
        id: verify_remote
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_SYNC_TOKEN }}
        run: |
          cd target-repo
          
          BRANCH_NAME="sync/plugin-metadata"
          
          echo "🔍 校验远端分支是否可见..."
          git ls-remote --heads "https://x-access-token:${GH_TOKEN}@github.com/${{ steps.fork_info.outputs.fork_repo }}.git" "${BRANCH_NAME}"
          
          REMOTE_SHA=$(git ls-remote --heads "https://x-access-token:${GH_TOKEN}@github.com/${{ steps.fork_info.outputs.fork_repo }}.git" "${BRANCH_NAME}" | awk '{print $1}')
          
          if [ -z "${REMOTE_SHA}" ]; then
            echo "❌ 远端分支不可见，等待后重试..."
            sleep 10
            REMOTE_SHA=$(git ls-remote --heads "https://x-access-token:${GH_TOKEN}@github.com/${{ steps.fork_info.outputs.fork_repo }}.git" "${BRANCH_NAME}" | awk '{print $1}')
          fi
          
          if [ -z "${REMOTE_SHA}" ]; then
            echo "❌ 远端分支仍然不可见，放弃创建 PR"
            echo "remote_visible=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          echo "✅ 远端分支可见，SHA: ${REMOTE_SHA}"
          echo "remote_visible=true" >> $GITHUB_OUTPUT
          echo "remote_sha=${REMOTE_SHA}" >> $GITHUB_OUTPUT
      
      - name: Create Pull Request
        if: |
          steps.check_metadata_changed.outputs.has_changes == 'true' &&
          steps.check_changes.outputs.has_changes == 'true' &&
          steps.verify_remote.outputs.remote_visible == 'true'
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_SYNC_TOKEN }}
        run: |
          cd target-repo
          
          FORK_OWNER="${{ steps.fork_info.outputs.fork_owner }}"
          BRANCH_NAME="sync/plugin-metadata"
          
          echo "🔍 调试信息："
          echo "  TARGET_REPO=${{ env.TARGET_REPO }}"
          echo "  HEAD=${FORK_OWNER}:${BRANCH_NAME}"
          echo "  BASE=${{ env.TARGET_BRANCH }}"
          
          # 等待 GitHub 后端完全同步
          sleep 5
          
          gh pr create \
            --repo "${{ env.TARGET_REPO }}" \
            --head "${FORK_OWNER}:${BRANCH_NAME}" \
            --base "${{ env.TARGET_BRANCH }}" \
            --title "🤖 Auto-sync: Update plugin metadata from ${{ github.repository }}" \
            --body "## 📝 自动同步插件元数据

          检测到插件仓库 **${{ github.repository }}** 的 \`main.py\` 中的元数据发生了更新。

          ### 📋 更新内容
          - 插件名称: ${{ steps.check_meta.outputs.plugin_name }}
          - 版本: 已从源码同步

          > 🤖 此PR由GitHub Actions自动创建"
      
      - name: No changes in metadata
        if: steps.check_metadata_changed.outputs.has_changes == 'false'
        run: echo "ℹ️  main.py 中的元数据未发生变化，无需同步"
      
      - name: No changes in plugins.json
        if: |
          steps.check_metadata_changed.outputs.has_changes == 'true' &&
          steps.check_changes.outputs.has_changes == 'false'
        run: echo "ℹ️  plugins.json 已是最新，无需更新"
      
      - name: Push succeeded but PR creation skipped
        if: |
          steps.check_metadata_changed.outputs.has_changes == 'true' &&
          steps.check_changes.outputs.has_changes == 'true' &&
          steps.verify_remote.outputs.remote_visible == 'false'
        run: |
          echo "⚠️  代码已推送到 fork，但远端分支校验失败，跳过 PR 创建"
          echo "你可以手动前往 https://github.com/${{ steps.fork_info.outputs.fork_repo }}/tree/sync/plugin-metadata 创建 PR"
