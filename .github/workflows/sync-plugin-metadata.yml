name: Sync Plugin Metadata to Plugin Market

on:
  push:
    paths:
      - 'main.py'
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_REPO: ElainaCore/Elaina-plugins
  TARGET_BRANCH: main

jobs:
  sync-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout your plugin repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PLUGIN_SYNC_TOKEN }}
      
      - name: Set fork info
        id: fork_info
        run: |
          echo "fork_owner=${{ github.repository_owner }}" >> $GITHUB_OUTPUT
          echo "fork_repo=${{ github.repository_owner }}/Elaina-plugins" >> $GITHUB_OUTPUT
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Check if metadata changed
        id: check_metadata_changed
        run: |
          git show HEAD~1:main.py > main_old.py 2>/dev/null || echo "" > main_old.py
          python .github/scripts/extract_metadata_compare.py main_old.py main.py
          
          if [ -f "metadata_changed.txt" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            cat metadata_changed.txt
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️  main.py 中的元数据未发生变化，跳过同步"
          fi
      
      - name: Extract metadata from main.py
        if: steps.check_metadata_changed.outputs.has_changes == 'true'
        id: extract_meta
        run: python .github/scripts/extract_metadata.py
      
      - name: Check if metadata exists
        if: steps.check_metadata_changed.outputs.has_changes == 'true'
        id: check_meta
        run: |
          if [ -f "metadata.json" ]; then
            echo "has_metadata=true" >> $GITHUB_OUTPUT
            echo "plugin_name=$(jq -r '.name' metadata.json)" >> $GITHUB_OUTPUT
          else
            echo "has_metadata=false" >> $GITHUB_OUTPUT
          fi
      
      # Clone fork，以 fork 数据为准
      - name: Clone FORK repository
        if: |
          steps.check_metadata_changed.outputs.has_changes == 'true' &&
          steps.check_meta.outputs.has_metadata == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.fork_info.outputs.fork_repo }}
          path: target-repo
          token: ${{ secrets.PLUGIN_SYNC_TOKEN }}
          fetch-depth: 1
      
      # 更新 plugins.json，但不修改 name 字段；未找到插件则报错停止
      - name: Update plugins.json (skip 'name' field)
        if: |
          steps.check_metadata_changed.outputs.has_changes == 'true' &&
          steps.check_meta.outputs.has_metadata == 'true'
        run: |
          cd target-repo
          python3 -c "
          import json, sys
          from pathlib import Path
          
          # 读取元数据
          with open('../metadata.json', 'r', encoding='utf-8') as f:
              new_metadata = json.load(f)
          
          # 读取 fork 的 plugins.json
          target_file = 'plugins.json'
          with open(target_file, 'r', encoding='utf-8') as f:
              plugins_data = json.load(f)
          
          if not isinstance(plugins_data, list):
              print('❌ plugins.json 不是数组')
              sys.exit(1)
          
          plugin_name = new_metadata.get('name')
          plugin_github = new_metadata.get('github')
          
          if not plugin_name:
              print('❌ 元数据中缺少 name 字段')
              sys.exit(1)
          if not plugin_github:
              print('❌ 元数据中缺少 github 字段')
              sys.exit(1)
          
          # 更新字段列表（不含 name）
          UPDATE_KEYS = ['author', 'description', 'version', 'github']
          
          matched = False
          updated = False
          for plugin in plugins_data:
              if not isinstance(plugin, dict):
                  continue
              if (plugin_github and plugin.get('github') == plugin_github) or \
                 (plugin_name and plugin.get('name') == plugin_name):
                  matched = True
                  for key in UPDATE_KEYS:
                      if key in new_metadata and new_metadata[key]:
                          old_value = plugin.get(key)
                          new_value = new_metadata[key]
                          if old_value != new_value:
                              plugin[key] = new_value
                              print(f'  {key}: {old_value} -> {new_value}')
                              updated = True
                  break
          
          if not matched:
              print(f'❌ 未找到匹配的插件: {plugin_name}')
              print(f'   匹配依据: github={plugin_github} 或 name={plugin_name}')
              sys.exit(1)
          
          if updated:
              with open(target_file, 'w', encoding='utf-8') as f:
                  json.dump(plugins_data, f, ensure_ascii=False, indent=2)
                  f.write('\n')
              print(f'✅ 已更新 plugins.json（name 字段未修改）')
          else:
              print('ℹ️  无字段需要更新')
          "
      
      - name: Check for changes in target repo
        if: |
          steps.check_metadata_changed.outputs.has_changes == 'true' &&
          steps.check_meta.outputs.has_metadata == 'true'
        id: check_changes
        run: |
          cd target-repo
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            git status
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          fi
      
      - name: Commit, push to fork and create PR
        if: |
          steps.check_metadata_changed.outputs.has_changes == 'true' &&
          steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_SYNC_TOKEN }}
        run: |
          cd target-repo
          
          FORK_OWNER="${{ steps.fork_info.outputs.fork_owner }}"
          FORK_REPO="${{ steps.fork_info.outputs.fork_repo }}"
          BRANCH_NAME="main"
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add plugins.json
          git commit -m "chore: sync plugin metadata from ${{ github.repository }}
          
          Plugin: ${{ steps.check_meta.outputs.plugin_name }}"
          
          echo "🔍 Pushing to fork ${FORK_REPO}:${BRANCH_NAME}..."
          git remote add fork "https://x-access-token:${GH_TOKEN}@github.com/${FORK_REPO}.git"
          git push fork "HEAD:${BRANCH_NAME}" --force
          
          echo "🔍 Verifying remote branch..."
          git ls-remote --heads "https://x-access-token:${GH_TOKEN}@github.com/${FORK_REPO}.git" "${BRANCH_NAME}"
          
          echo "🔍 Creating PR..."
          echo "  TARGET_REPO: ${{ env.TARGET_REPO }}"
          echo "  HEAD: ${FORK_OWNER}:${BRANCH_NAME}"
          echo "  BASE: ${{ env.TARGET_BRANCH }}"
          
          sleep 5
          
          gh pr create \
            --repo "${{ env.TARGET_REPO }}" \
            --head "${FORK_OWNER}:${BRANCH_NAME}" \
            --base "${{ env.TARGET_BRANCH }}" \
            --title "🤖 Auto-sync: Update plugin metadata from ${{ github.repository }}" \
            --body "## 📝 自动同步插件元数据

          检测到插件仓库 **${{ github.repository }}** 的 \`main.py\` 中的元数据发生了更新。

          ### 📋 更新内容
          - 插件名称: ${{ steps.check_meta.outputs.plugin_name }}
          - 版本: 已从源码同步
          - 注意: name 字段不会被修改

          > 🤖 此PR由GitHub Actions自动创建"
      
      - name: No changes in metadata
        if: steps.check_metadata_changed.outputs.has_changes == 'false'
        run: echo "ℹ️  main.py 中的元数据未发生变化，无需同步"
      
      - name: No changes in plugins.json
        if: |
          steps.check_metadata_changed.outputs.has_changes == 'true' &&
          steps.check_changes.outputs.has_changes == 'false'
        run: echo "ℹ️  plugins.json 已是最新，无需更新"
